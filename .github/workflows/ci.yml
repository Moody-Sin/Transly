name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

jobs:
  rust-checks:
    name: Rust 校验与测试 (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy, llvm-tools-preview
      - name: Rust 依赖与系统库准备
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev libdbus-1-dev gnome-keyring
      - name: 格式校验
        run: cargo fmt --all --check
      - name: Clippy 校验 (Debug)
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Clippy 校验 (Release)
        run: cargo clippy --release --workspace -- -D warnings
      - name: 测试套件
        run: cargo test --workspace
      - name: 安装覆盖率工具
        uses: taiki-e/install-action@cargo-llvm-cov
      - name: 核心覆盖率门禁 (transly-core >= 70%)
        run: cargo llvm-cov --package transly-core --fail-under-lines 70 --summary-only

  windows-checks:
    name: Rust 校验与测试 (Windows 原生)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: 格式校验
        run: cargo fmt --all --check
      - name: Clippy 校验全目标 (Windows / WinRT 分支)
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Clippy 校验 (Release)
        run: cargo clippy --release --workspace -- -D warnings
      - name: 运行 Windows 原生测试套件
        run: cargo test --workspace

  frontend-checks:
    name: 前端与插件编译检查
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: pnpm/action-setup@v3
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'
      - name: Rust 系统依赖（用于生成 bindings）
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev
      - name: 安装前端依赖
        run: pnpm install
      - name: 校验 Specta 类型绑定同步
        run: |
          pnpm run generate:bindings
          git diff --exit-code src/bindings.ts
      - name: 桌面端构建校验
        run: pnpm run build
      - name: 前端规范检查
        run: pnpm run lint
      - name: 前端格式检查
        run: pnpm run format:check
      - name: 前端任务单测
        run: pnpm run test:task
      - name: 浏览器插件构建校验
        run: pnpm --filter transly-extension run build

  security-scan:
    name: 安全密钥扫描 (Gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Gitleaks 密钥检测
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
