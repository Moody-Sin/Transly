name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

jobs:
  rust-checks:
    name: Rust 校验与测试 (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy, llvm-tools-preview
      - name: Rust 依赖与系统库准备
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev libdbus-1-dev gnome-keyring
      - name: 格式校验
        run: cargo fmt --all --check
      - name: Clippy 校验 (Debug)
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Clippy 校验 (Release)
        run: cargo clippy --release --workspace -- -D warnings
      - name: 测试套件
        run: cargo test --workspace
      - name: 安装覆盖率工具
        uses: taiki-e/install-action@cargo-llvm-cov
      - name: 核心覆盖率门禁 (transly-core >= 70%)
        run: cargo llvm-cov --package transly-core --fail-under-lines 70 --summary-only

  windows-checks:
    name: Rust 校验与测试 (Windows 原生)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: 格式校验
        run: cargo fmt --all --check
      - name: Clippy 校验全目标 (Windows / WinRT 分支)
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Clippy 校验 (Release)
        run: cargo clippy --release --workspace -- -D warnings
      - name: 运行 Windows 原生测试套件
        run: cargo test --workspace

  macos-checks:
    name: Rust 校验与测试 (macOS 原生)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: 格式校验
        run: cargo fmt --all --check
      - name: Clippy 校验 (Apple-native Keyring 分支)
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: 运行 macOS 测试套件
        run: cargo test --workspace

  frontend-checks:
    name: 前端与插件编译检查
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: pnpm/action-setup@v3
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'
      - name: Rust 系统依赖（用于生成 bindings）
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev libdbus-1-dev gnome-keyring
      - name: 安装前端依赖
        run: pnpm install --frozen-lockfile
      - name: 校验 Specta 类型绑定同步
        run: |
          pnpm run generate:bindings
          git diff --exit-code src/bindings.ts
      - name: 桌面端构建校验
        run: pnpm run build
      - name: 前端规范检查
        run: pnpm run lint
      - name: 前端格式检查
        run: pnpm run format:check
      - name: 前端任务单测
        run: pnpm run test:task
      - name: 浏览器插件构建校验
        run: pnpm --filter transly-extension run build
      - name: 安装 Playwright 无头浏览器
        run: pnpm exec playwright install --with-deps chromium
      - name: 运行桌面端 UI 全交互 E2E 测试
        run: pnpm run test:e2e:ui
      - name: 编译真实本地测试服务 (transly_test_server)
        run: cargo build --package src-tauri --bin transly_test_server
      - name: 运行浏览器插件真实端到端 E2E 测试
        run: pnpm run test:e2e:extension

  repo-hygiene:
    name: 仓库卫生检查（构建产物 / 大文件）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # PROJECT_RULES 的 CI 清单要求「禁止提交文件检查（大文件、node_modules）」，
      # 此前只有文档声明而无任何自动化守护。
      - name: 禁止跟踪构建产物与依赖目录
        run: |
          offenders=$(git ls-files | grep -E '(^|/)(node_modules|target|dist|dist-firefox|\.superpowers)/' || true)
          if [ -n "$offenders" ]; then
            echo "::error::以下构建产物/依赖目录被错误跟踪："
            echo "$offenders"
            exit 1
          fi
          echo "未发现被跟踪的构建产物"
      - name: 禁止跟踪超大文件（>1MB）
        run: |
          # Cargo.lock / pnpm-lock.yaml 等锁文件属正常，此处只拦真正的大文件
          big=$(git ls-files -z | xargs -0 -r ls -l 2>/dev/null | awk '$5 > 1048576 {print $5" "$9}')
          if [ -n "$big" ]; then
            echo "::error::以下文件超过 1MB："
            echo "$big"
            exit 1
          fi
          echo "未发现超大文件"

  security-scan:
    name: 安全密钥扫描 (Gitleaks)
    runs-on: ubuntu-latest
    # gitleaks-action 在 pull_request 触发时会调用
    # GET /repos/{owner}/{repo}/pulls/{pull_number}/commits 枚举本次 PR 的全部提交，
    # 默认 GITHUB_TOKEN 缺少 pull-requests: read 会报
    # 403 Resource not accessible by integration，必须显式授予。
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Gitleaks 密钥检测
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
