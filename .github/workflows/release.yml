name: Release

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-tauri:
    name: 构建桌面端 (${{ matrix.platform }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: windows-x64
          - os: macos-latest
            platform: macos-arm64
          - os: ubuntu-22.04
            platform: linux-x64

    steps:
      - uses: actions/checkout@v4

      - name: 安装 Node.js 与 pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: 安装 Rust 工具链
        uses: dtolnay/rust-toolchain@stable

      - name: 安装 Linux 系统依赖
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev libdbus-1-dev gnome-keyring libxcb1-dev tesseract-ocr tesseract-ocr-chi-sim tesseract-ocr-eng
          # ↑ libxcb1-dev：截图翻译的 Linux X11 屏幕捕获直接依赖（crates: xcb）。
          # ↑ tesseract-ocr*：Linux OCR 路径外呼该工具，且 src-tauri 的 OCR 端到端
          #   测试（tests/ocr_e2e.rs）会真实调用它并断言块坐标落点，故 CI 必须安装，
          #   否则测试在 CI 上直接失败。
          # 三处 apt 清单（ci.yml 的 rust-checks / frontend-checks、release.yml）须保持一致：
          # frontend-checks 会完整编译 src-tauri 以生成 bindings，漏改即红。

      - name: 安装前端依赖
        run: pnpm install --frozen-lockfile

      - name: 生成强类型绑定
        run: pnpm run generate:bindings

      - name: 构建 Tauri 应用程序
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # 更新包签名私钥：缺失时 tauri-action 无法生成 .sig 与 latest.json。
          # 仓库 Secrets 需配置 TAURI_SIGNING_PRIVATE_KEY（内容为 minisign 私钥文本）。
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'Transly ${{ github.ref_name }}'
          releaseBody: '参见 CHANGELOG.md 获取完整发布说明。'
          releaseDraft: false
          prerelease: false
          # Windows 同时产出 NSIS 与 MSI 时，更新清单优先指向 NSIS 安装包。
          updaterJsonPreferNsis: true

      - name: 提取 Windows 单文件免安装便携版产物
        if: matrix.os == 'windows-latest'
        shell: bash
        run: |
          if [ -f "target/release/transly.exe" ]; then
            cp "target/release/transly.exe" "Transly-Portable-${{ matrix.platform }}.exe"
          elif [ -f "src-tauri/target/release/transly.exe" ]; then
            cp "src-tauri/target/release/transly.exe" "Transly-Portable-${{ matrix.platform }}.exe"
          else
            echo "未找到 release 二进制文件！"
            exit 1
          fi

      - name: 上传 Windows 单文件便携版至 GitHub Release
        uses: softprops/action-gh-release@v2
        if: matrix.os == 'windows-latest' && startsWith(github.ref, 'refs/tags/')
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          files: Transly-Portable-${{ matrix.platform }}.exe

  build-extension:
    name: 打包浏览器扩展 (.zip)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 安装 Node.js 与 pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: 构建扩展
        run: |
          pnpm install --frozen-lockfile
          # 从 git tag 注入版本号：manifest.json 里的硬编码版本会随 tag 变化而漂移，
          # 导致 Chrome Web Store 以「版本号未递增」拒绝上传。
          # tag 形如 v0.3.0，需剥离前缀 v 才是合法 manifest version。
          # 注意：workflow_dispatch 在分支上触发时 GITHUB_REF_NAME 是分支名（如 main），
          # 直接注入会把非法版本号写进 manifest.json，因此只有 tag 触发才覆盖版本号，
          # 其余情况交由 postbuild.mjs 保留 extension/package.json 中的合法版本号。
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            export TRANSLY_EXT_VERSION="${GITHUB_REF_NAME#v}"
            echo "扩展版本号（来自 tag）：$TRANSLY_EXT_VERSION"
          else
            echo "非 tag 触发，沿用 extension/package.json 版本号"
          fi
          pnpm --filter transly-extension run build
          pnpm --filter transly-extension run build:firefox

      - name: 压缩扩展产物
        run: |
          cd extension/dist
          zip -r ../../transly-extension-${{ github.ref_name }}.zip ./*
          cd ../..
          # Firefox 专属产物（gecko ID 与 background.scripts 兼容层）
          cd extension/dist-firefox
          zip -r ../../transly-extension-firefox-${{ github.ref_name }}.zip ./*
          cd ../..

      - name: 上传扩展发布产物至 GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          files: |
            transly-extension-${{ github.ref_name }}.zip
            transly-extension-firefox-${{ github.ref_name }}.zip
