[package]
name = "transly-core"
version = "0.1.0"
edition = "2021"
authors = ["Transly Authors"]
description = "Core logic for Transly translation engine, cache, detection, and glossary."
license = "MIT"

[dependencies]
async-trait = "0.1"
thiserror = "2.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.43", features = ["sync", "macros", "rt"] }
rusqlite = { version = "0.33", features = ["bundled"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
sha2 = "0.10"

[dev-dependencies]
tokio = { version = "1.43", features = ["full"] }
tempfile = "3.17"
