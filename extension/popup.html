<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <title>Transly</title>
    <style>
      body {
        width: 230px;
        margin: 0;
        padding: 12px;
        font-family:
          system-ui,
          -apple-system,
          sans-serif;
        font-size: 13px;
        color: #1e293b;
        background: #f8fafc;
      }
      .header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-bottom: 12px;
        font-weight: 600;
      }
      .status {
        font-size: 11px;
        color: #64748b;
      }
      .btn {
        width: 100%;
        padding: 7px 0;
        margin-bottom: 8px;
        border: none;
        border-radius: 6px;
        font-size: 12px;
        font-weight: 500;
        cursor: pointer;
        transition: background 0.15s;
      }
      .btn-primary {
        background: #4f46e5;
        color: #ffffff;
      }
      .btn-primary:hover {
        background: #4338ca;
      }
      .btn-secondary {
        background: #e2e8f0;
        color: #334155;
      }
      .btn-secondary:hover {
        background: #cbd5e1;
      }
      .token-box {
        margin-top: 10px;
        padding-top: 10px;
        border-top: 1px dashed #cbd5e1;
      }
      .token-input {
        width: 100%;
        box-sizing: border-box;
        padding: 6px 8px;
        font-size: 11px;
        border: 1px solid #cbd5e1;
        border-radius: 4px;
        outline: none;
        margin-bottom: 6px;
        background: #ffffff;
      }
      .token-input:focus {
        border-color: #4f46e5;
      }
      .btn-sm {
        padding: 4px 0;
        font-size: 11px;
      }
    </style>
  </head>
  <body>
    <div class="header">
      <span>Transly</span>
      <span id="conn-status" class="status" data-i18n="connChecking">检测连接中...</span>
    </div>
    <div class="engine-box" style="margin-bottom: 8px; display: flex; gap: 6px">
      <select id="select-engine" class="token-input" style="margin-bottom: 0; flex: 1.4">
        <option value="google" data-i18n="engineGoogle">Google 网页翻译</option>
        <option value="offline" data-i18n="engineOffline">纯本地离线</option>
        <option value="deepl">DeepL</option>
        <option value="deepseek">DeepSeek</option>
        <option value="openai">OpenAI</option>
      </select>
      <select id="select-lang" class="token-input" style="margin-bottom: 0; flex: 1">
        <option value="zh-CN" data-i18n="langNameZh">简体中文</option>
        <option value="en" data-i18n="langNameEn">English</option>
        <option value="ja" data-i18n="langNameJa">日本語</option>
        <option value="ko" data-i18n="langNameKo">한국어</option>
        <option value="fr" data-i18n="langNameFr">Français</option>
        <option value="de" data-i18n="langNameDe">Deutsch</option>
      </select>
    </div>
    <div style="display: flex; gap: 8px; margin-bottom: 8px; font-size: 11px; color: #475569">
      <label style="display: flex; align-items: center; gap: 3px; cursor: pointer">
        <input type="radio" name="transly_mode" value="replace" checked />
        <span data-i18n="modeReplace">仅译文</span>
      </label>
      <label style="display: flex; align-items: center; gap: 3px; cursor: pointer">
        <input type="radio" name="transly_mode" value="bilingual" />
        <span data-i18n="modeBilingual">双语对照</span>
      </label>
    </div>
    <button id="btn-translate" class="btn btn-primary" data-i18n="btnTranslate">翻译此网页</button>
    <button id="btn-cancel" class="btn btn-secondary" style="display: none" data-i18n="btnCancel">
      取消翻译
    </button>
    <button id="btn-retry" class="btn btn-secondary" style="display: none" data-i18n="btnRetry">
      重试失败项
    </button>
    <button id="btn-restore" class="btn btn-secondary" data-i18n="btnRestore">还原原文</button>

    <div
      id="progress-box"
      style="
        display: none;
        margin-bottom: 8px;
        padding: 6px 8px;
        background: #e0e7ff;
        border-radius: 6px;
        font-size: 11px;
        color: #3730a3;
      "
    >
      <div style="display: flex; justify-content: space-between; margin-bottom: 4px">
        <span id="progress-text" data-i18n="progressPreparing">准备翻译...</span>
        <span id="progress-count">0/0</span>
      </div>
      <div
        style="width: 100%; height: 4px; background: #c7d2fe; border-radius: 2px; overflow: hidden"
      >
        <div
          id="progress-bar"
          style="width: 0%; height: 100%; background: #4f46e5; transition: width 0.2s"
        ></div>
      </div>
    </div>

    <div style="margin-top: 8px; padding-top: 6px; border-top: 1px solid #f1f5f9">
      <div
        style="
          display: flex;
          align-items: center;
          justify-content: space-between;
          margin-bottom: 4px;
        "
      >
        <label
          style="
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 11px;
            color: #475569;
            cursor: pointer;
          "
        >
          <input type="checkbox" id="check-site-auto" />
          <span data-i18n="siteRuleAuto">为此站点记住自动翻译</span>
        </label>
        <button
          id="btn-toggle-site-rules"
          type="button"
          style="
            background: none;
            border: none;
            padding: 2px 4px;
            font-size: 10px;
            color: #6366f1;
            cursor: pointer;
            text-decoration: underline;
          "
          data-i18n="siteRuleTitle"
        >
          站点规则设置
        </button>
      </div>

      <div
        id="site-rules-details"
        style="
          display: none;
          padding: 6px;
          background: #f1f5f9;
          border-radius: 4px;
          margin-top: 4px;
          font-size: 11px;
        "
      >
        <div style="margin-bottom: 6px">
          <label
            style="display: block; color: #475569; font-size: 10px; margin-bottom: 2px"
            data-i18n="siteRuleTargetLang"
            >站点专属目标语言</label
          >
          <select
            id="select-site-lang"
            class="token-input"
            style="margin-bottom: 0; padding: 3px 6px; font-size: 10px"
          >
            <option value="" data-i18n="siteRuleLangFollowGlobal">跟随全局设置</option>
            <option value="zh-CN" data-i18n="langNameZh">简体中文</option>
            <option value="en" data-i18n="langNameEn">English</option>
            <option value="ja" data-i18n="langNameJa">日本語</option>
            <option value="ko" data-i18n="langNameKo">한국어</option>
            <option value="fr" data-i18n="langNameFr">Français</option>
            <option value="de" data-i18n="langNameDe">Deutsch</option>
          </select>
        </div>

        <div style="margin-bottom: 6px">
          <label
            style="display: block; color: #475569; font-size: 10px; margin-bottom: 2px"
            data-i18n="siteRuleExcludeSelectors"
            >排除选择器 (CSS)</label
          >
          <input
            type="text"
            id="input-site-exclude"
            class="token-input"
            style="margin-bottom: 0; padding: 3px 6px; font-size: 10px"
            placeholder="例如: .code, pre, .comments"
            data-i18n-placeholder="siteRuleExcludePlaceholder"
          />
        </div>

        <div>
          <label
            style="
              display: flex;
              align-items: center;
              gap: 4px;
              color: #475569;
              font-size: 10px;
              cursor: pointer;
            "
          >
            <input type="checkbox" id="check-site-disable-input" />
            <span data-i18n="siteRuleDisableInputAssistant">在此站点禁用输入框替换助手</span>
          </label>
        </div>
      </div>
    </div>

    <div class="token-box">
      <button
        id="btn-auto-pair"
        class="btn btn-primary"
        style="display: none; margin-bottom: 6px; background: #4f46e5; color: #fff"
        data-i18n="btnAutoPair"
      >
        一键配对桌面端
      </button>
      <div
        id="pairing-message"
        style="
          display: none;
          font-size: 11px;
          margin-bottom: 6px;
          text-align: center;
          color: #4f46e5;
        "
      ></div>
      <div id="manual-token-section">
        <input
          type="password"
          id="input-token"
          class="token-input"
          placeholder="粘贴桌面端配对 Token"
          data-i18n-placeholder="tokenPlaceholder"
        />
        <button id="btn-save-token" class="btn btn-secondary btn-sm" data-i18n="btnSaveToken">
          保存配对 Token
        </button>
      </div>
    </div>

    <script src="popup.js"></script>
  </body>
</html>
