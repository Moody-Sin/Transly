<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <title>Transly</title>
  <style>
    body {
      width: 220px;
      margin: 0;
      padding: 12px;
      font-family: system-ui, -apple-system, sans-serif;
      font-size: 13px;
      color: #1e293b;
      background: #f8fafc;
    }
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 12px;
      font-weight: 600;
    }
    .status {
      font-size: 11px;
      color: #64748b;
    }
    .btn {
      width: 100%;
      padding: 7px 0;
      margin-bottom: 8px;
      border: none;
      border-radius: 6px;
      font-size: 12px;
      font-weight: 500;
      cursor: pointer;
      transition: background 0.15s;
    }
    .btn-primary {
      background: #4f46e5;
      color: #ffffff;
    }
    .btn-primary:hover {
      background: #4338ca;
    }
    .btn-secondary {
      background: #e2e8f0;
      color: #334155;
    }
    .btn-secondary:hover {
      background: #cbd5e1;
    }
    .token-box {
      margin-top: 10px;
      padding-top: 10px;
      border-top: 1px dashed #cbd5e1;
    }
    .token-input {
      width: 100%;
      box-sizing: border-box;
      padding: 6px 8px;
      font-size: 11px;
      border: 1px solid #cbd5e1;
      border-radius: 4px;
      outline: none;
      margin-bottom: 6px;
      background: #ffffff;
    }
    .token-input:focus {
      border-color: #4f46e5;
    }
    .btn-sm {
      padding: 4px 0;
      font-size: 11px;
    }
  </style>
</head>
<body>
  <div class="header">
    <span>Transly</span>
    <span id="conn-status" class="status">检测连接中...</span>
  </div>
  <div class="engine-box" style="margin-bottom: 8px;">
    <select id="select-engine" class="token-input" style="margin-bottom: 0;">
      <option value="google">默认引擎 (Google 免Key)</option>
      <option value="deepl">DeepL 翻译</option>
      <option value="deepseek">DeepSeek LLM</option>
      <option value="openai">OpenAI</option>
    </select>
  </div>
  <button id="btn-translate" class="btn btn-primary">翻译此网页 (仅译文)</button>
  <button id="btn-restore" class="btn btn-secondary">还原原文</button>

  <div class="token-box">
    <input type="password" id="input-token" class="token-input" placeholder="粘贴桌面端配对 Token" />
    <button id="btn-save-token" class="btn btn-secondary btn-sm">保存配对 Token</button>
  </div>

  <script src="popup.js"></script>
</body>
</html>
