pre-commit:
  parallel: true
  commands:
    rust-fmt:
      run: cargo fmt --all --check
    rust-clippy:
      run: cargo clippy --workspace --all-targets -- -D warnings
    rust-test:
      run: cargo test --workspace
    type-check-desktop:
      run: pnpm --filter transly exec tsc --noEmit
    type-check-extension:
      run: pnpm --filter transly-extension exec tsc --noEmit
    frontend-lint:
      run: pnpm run lint
    frontend-format:
      run: pnpm run format:check
    frontend-test:
      run: pnpm run test:task
