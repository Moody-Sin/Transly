pre-commit:
  parallel: true
  commands:
    rust-fmt:
      run: command -v cargo >/dev/null 2>&1 && cargo fmt --all --check || true
    rust-clippy:
      run: command -v cargo >/dev/null 2>&1 && cargo clippy --workspace --all-targets -- -D warnings || true
    rust-test:
      run: command -v cargo >/dev/null 2>&1 && cargo test --workspace || true
    type-check-desktop:
      run: pnpm --filter transly exec tsc --noEmit
    type-check-extension:
      run: pnpm --filter transly-extension exec tsc --noEmit
    frontend-lint:
      run: pnpm run lint
    frontend-format:
      run: pnpm run format:check
    frontend-test:
      run: pnpm run test:task

commit-msg:
  commands:
    conventional-commits:
      run: node scripts/check-commit-msg.mjs {1}
