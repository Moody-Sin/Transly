[package]
name = "src-tauri"
version = "0.3.0"
edition = "2021"
authors = ["Transly Authors"]
description = "Tauri backend and platform integration for Transly."
license = "MIT"
default-run = "transly"

[[bin]]
name = "export_bindings"
path = "bin/export_bindings.rs"

[[bin]]
name = "transly"
path = "src/main.rs"

[[bin]]
name = "transly_test_server"
path = "bin/transly_test_server.rs"

[build-dependencies]
tauri-build = { version = "2.0", features = [] }

[dependencies]
transly-core = { path = "../crates/transly-core" }
tauri = { version = "2.0", features = ["tray-icon"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.43", features = ["full"] }
axum = "0.8"
tower-http = { version = "0.6", features = ["cors"] }
anyhow = "1.0"
tauri-specta = { version = "2.0.0-rc.25", features = ["javascript", "typescript"] }
specta = "=2.0.0-rc.25"
specta-typescript = "0.0.12"
tauri-plugin-global-shortcut = "2"
tauri-plugin-clipboard-manager = "2"
enigo = "0.3"
rand = "0.8"
# 恒定时间比较：Bearer Token 鉴权防止计时侧信道
subtle = "2.6"
async-trait = "0.1"

[target.'cfg(target_os = "windows")'.dependencies]
keyring = { version = "3.6", features = ["windows-native"] }
windows = { version = "0.62", features = [
    "Media_Ocr",
    "Graphics_Imaging",
    "Storage_Streams",
    "Win32_System_WinRT",
    "Globalization",
] }
image = { version = "0.25", default-features = false, features = ["png"] }

[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "3.6", features = ["apple-native"] }

[target.'cfg(all(not(target_os = "windows"), not(target_os = "macos")))'.dependencies]
keyring = { version = "3.6", features = ["sync-secret-service", "crypto-rust"] }

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"

