[package]
name = "src-tauri"
version = "0.1.0"
edition = "2021"
authors = ["Transly Authors"]
description = "Tauri backend and platform integration for Transly."
license = "MIT"

[build-dependencies]
tauri-build = { version = "2.0", features = [] }

[dependencies]
transly-core = { path = "../crates/transly-core" }
tauri = { version = "2.0", features = ["tray-icon"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.43", features = ["full"] }
axum = "0.8"
tower-http = { version = "0.6", features = ["cors"] }
anyhow = "1.0"
keyring = "3.6"

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
async-trait = "0.1"

